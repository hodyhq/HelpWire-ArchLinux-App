name: update

# Keeps the package current with upstream HelpWire with no manual step.
#
# sync    - daily (and on demand) read the app's own auto-update manifest; when a new
#           version appears, recompute the tarball sha256, bump the PKGBUILD, and commit
#           the bump back here. Optionally pushes to the AUR (dormant until the
#           AUR_SSH_PRIVATE_KEY secret is set, e.g. once AUR registration reopens).
# release - build the package in an Arch container, GPG-sign it and the repo DB, and
#           publish both the custom pacman repo (the fixed "repo" release) and an
#           official versioned release, so `pacman -Syu` upgrades it under SigLevel=Required.
#
# Required secret: GPG_PRIVATE_KEY (ascii-armored private key; its public half is
# helpwire.pub, imported by users via pacman-key). AUR_SSH_PRIVATE_KEY is optional.

on:
  schedule:
    - cron: '0 8 * * *'   # daily 08:00 UTC
  workflow_dispatch:
    inputs:
      force_publish:
        description: Rebuild and publish even if the version is unchanged
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect upstream version and bump
        id: bump
        run: |
          set -euo pipefail
          manifest='https://get.helpwire.app/downloads/operator/linux/update/settings.xml'
          tarball='https://get.helpwire.app/downloads/operator/linux/helpwire-quick.tar.gz'
          up="$(curl -fsSL "$manifest" | grep -oE '<current_version>[^<]+</current_version>' | sed -E 's:</?current_version>::g' | head -1)"
          cur="$(sed -n 's/^pkgver=//p' PKGBUILD | head -1)"
          [ -n "$up" ] || { echo 'could not read upstream version'; exit 1; }
          # Validate the external manifest value before it reaches sed/pacman.
          [[ "$up" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "unexpected version format: $up"; exit 1; }
          echo "upstream=$up current=$cur"
          echo "version=$up" >> "$GITHUB_OUTPUT"
          if [ "$up" = "$cur" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha="$(curl -fsSL "$tarball" | sha256sum | cut -d' ' -f1)"
          sed -i -E "s/^pkgver=.*/pkgver=$up/" PKGBUILD
          sed -i -E 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          sed -i -E "0,/^sha256sums=\('[0-9a-f]+'/s//sha256sums=('$sha'/" PKGBUILD
          sed -i -E "s/^\tpkgver = .*/\tpkgver = $up/" .SRCINFO
          sed -i -E 's/^\tpkgrel = .*/\tpkgrel = 1/' .SRCINFO
          sed -i -E "s#(helpwire-operator-)[0-9.]+(\.tar\.gz::)#\1$up\2#" .SRCINFO
          sed -i -E "0,/^\tsha256sums = [0-9a-f]+/s//\tsha256sums = $sha/" .SRCINFO
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Commit bump back to GitHub
        if: steps.bump.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: bump to ${{ steps.bump.outputs.version }}"
          commit_user_name: helpwire-bot
          commit_user_email: hody@hody.dev

      - name: Publish to the AUR (dormant until AUR_SSH_PRIVATE_KEY is set)
        if: ${{ env.AUR_KEY != '' && (steps.bump.outputs.changed == 'true' || github.event.inputs.force_publish == 'true') }}
        uses: KSXGitHub/github-actions-deploy-aur@v2.7.2
        with:
          pkgname: helpwire-operator
          pkgbuild: ./PKGBUILD
          assets: helpwire-operator.desktop
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_username: hody
          commit_email: hody@hody.dev
          commit_message: "Update to ${{ steps.bump.outputs.version }}"

  release:
    needs: sync
    if: ${{ needs.sync.outputs.changed == 'true' || github.event.inputs.force_publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # pick up the bump commit sync just pushed

      - name: Build, sign, and assemble the repo in an Arch container
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$GPG_PRIVATE_KEY" ] || { echo 'GPG_PRIVATE_KEY secret is not set'; exit 1; }
          docker run --rm -e GPG_PRIVATE_KEY -v "$PWD":/w -w /w archlinux:latest bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed base-devel git gnupg
            useradd -m builder
            chown -R builder:builder /w
            runuser -u builder -- makepkg -f --nodeps --noconfirm
            mkdir -p dist
            cp ./*.pkg.tar.zst dist/
            cd dist
            repo-add helpwire.db.tar.gz ./*.pkg.tar.zst
            # repo-add emits symlinks; pacman fetches bare names, so make them real files.
            for f in helpwire.db helpwire.files; do cp --remove-destination "$(readlink -f "$f")" "$f"; done
            # GPG-sign every package and DB (detached, binary) so SigLevel=Required passes.
            export GNUPGHOME="$(mktemp -d)"
            printf "%s" "$GPG_PRIVATE_KEY" | gpg --batch --import
            for f in ./*.pkg.tar.zst helpwire.db.tar.gz helpwire.files.tar.gz; do
              gpg --batch --yes --pinentry-mode loopback --detach-sign --no-armor -o "$f.sig" "$f"
            done
            cp helpwire.db.tar.gz.sig helpwire.db.sig
            cp helpwire.files.tar.gz.sig helpwire.files.sig
            cp /w/helpwire.pub helpwire.pub
          '
          ls -lh dist

      - name: Publish the custom pacman repo (fixed "repo" release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view repo >/dev/null 2>&1 || \
            gh release create repo --title "pacman repo (helpwire)" \
              --notes "Custom pacman repository. See the README for the /etc/pacman.conf entry and the signing key." \
              --latest=false
          gh release upload repo --clobber \
            dist/helpwire.db dist/helpwire.db.sig \
            dist/helpwire.db.tar.gz dist/helpwire.db.tar.gz.sig \
            dist/helpwire.files dist/helpwire.files.sig \
            dist/helpwire.files.tar.gz dist/helpwire.files.tar.gz.sig \
            dist/helpwire.pub \
            dist/*.pkg.tar.zst dist/*.pkg.tar.zst.sig

      - name: Publish official versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.sync.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" --clobber dist/*.pkg.tar.zst dist/*.pkg.tar.zst.sig
          else
            gh release create "v$V" --title "v$V" \
              --notes "HelpWire Operator $V for Arch Linux. Install via the custom pacman repo (see the README), or 'sudo pacman -U' this asset." \
              dist/*.pkg.tar.zst dist/*.pkg.tar.zst.sig
          fi
